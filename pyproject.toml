[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-flag"
version = "1.0.0"
description = "Find the plays in flag football footage and cut them out"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "imageio-ffmpeg>=0.4.9",
    "ultralytics>=8.3",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.scripts]
scout = "scout.cli:main"

[tool.setuptools]
packages = ["scout"]

[tool.setuptools.package-data]
scout = ["py.typed"]
