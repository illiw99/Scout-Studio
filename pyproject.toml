[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-flag"
dynamic = ["version"]
description = "Native flag-football video review, play detection and clip export"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scout Studio contributors" }]
keywords = ["flag-football", "video", "ffmpeg", "play-detection"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]
reference = ["ultralytics>=8.3", "scikit-learn>=1.3"]
training = ["ultralytics>=8.3", "scikit-learn>=1.3", "matplotlib>=3.7"]
inference = [
    "onnx>=1.16,<2", "onnxruntime>=1.18,<2",
    "openvino>=2024.0,<2027; sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
]
dev = ["build>=1.2", "setuptools>=77", "tomli>=2; python_version < '3.11'"]

[project.scripts]
scout = "scout.cli:main"
scout-studio = "scout.desktop:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "scout.__version__" }

[tool.setuptools.packages.find]
include = ["scout", "scout.*"]
namespaces = false

[tool.setuptools.package-data]
scout = ["py.typed", "desktop/*.svg", "desktop/*.ico"]

[tool.setuptools.data-files]
"share/scout/models" = ["models/catalog.json", "models/README.md"]
"share/scout/models/scout-reviewed-precision/0.4.0" = ["models/scout-reviewed-precision/0.4.0/manifest.json", "models/scout-reviewed-precision/0.4.0/classifier.json"]
"share/scout/models/scout-reviewed-precision/0.5.0" = ["models/scout-reviewed-precision/0.5.0/manifest.json", "models/scout-reviewed-precision/0.5.0/classifier.json"]
"share/scout/models/person-transformer/1.0.0" = ["models/person-transformer/1.0.0/pipeline.json", "models/person-transformer/1.0.0/head.onnx"]
