name: Standalone installers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-22.04}
          - {platform: windows-x86_64, os: windows-2022}
          - {platform: macos-arm64, os: macos-15}
          - {platform: macos-x86_64, os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/locks/*.txt
      - name: Create isolated build environment
        shell: bash
        run: |
          python -m venv build-environment
          python - <<'PYTHON'
          import os
          from pathlib import Path
          scripts = Path('build-environment').resolve() / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(scripts) + '\n')
          PYTHON
      - name: Free unused SDK space on disposable Linux build runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h .
      - name: Install exact platform dependency snapshot
        shell: bash
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          case "$TARGET" in
            linux-x86_64) snapshot=linux-x86_64-cpu ;;
            windows-x86_64) snapshot=windows-x86_64-cpu ;;
            *) snapshot="$TARGET" ;;
          esac
          python scripts/dependency-locks.py --install --target "$snapshot"
          python scripts/dependency-locks.py --check-installed --target "$snapshot"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libpulse0 libasound2
      - name: Freeze and probe native processing engines in separate pinned environments
        shell: bash
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          python - <<'PYTHON'
          import os, shutil, subprocess, sys
          from pathlib import Path
          target = os.environ['TARGET']
          engines = [target] if target.startswith('macos') else [target + '-cpu', target + '-cuda']
          for engine in engines:
              python = Path(sys.executable)
              environment = None
              if engine.endswith('-cuda'):
                  environment = Path('cuda-build-environment').resolve()
                  subprocess.run([str(python), '-m', 'venv', str(environment)], check=True)
                  python = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
                  subprocess.run([str(python), 'scripts/dependency-locks.py', '--install',
                                  '--target', engine.replace('-cuda', '-cu128')], check=True)
              work = Path('build') / ('runtime-' + engine)
              subprocess.run([str(python), 'scripts/build-runtime.py', '--engine-id', engine,
                              '--work-dir', str(work), '--output-dir', 'dist/installers'], check=True)
              shutil.rmtree(work)
              if environment:
                  shutil.rmtree(environment)
          PYTHON
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Run source regression tests
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Check Windows background helpers keep logs without console windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'test_processes.py' -v
      - name: Check macOS disk image creation and retry handling
        if: runner.os == 'macOS'
        run: python -m unittest discover -s tests -p 'test_installer_build.py' -v
      - name: Build native installer
        env:
          # Certificate/keychain provisioning is external to this unsigned default.
          SCOUT_REQUIRE_SIGNING: ${{ github.event_name != 'pull_request' && vars.SCOUT_REQUIRE_SIGNING || '' }}
          SCOUT_WINDOWS_CERT_SHA1: ${{ github.event_name != 'pull_request' && vars.SCOUT_WINDOWS_CERT_SHA1 || '' }}
          SCOUT_MAC_SIGN_IDENTITY: ${{ github.event_name != 'pull_request' && vars.SCOUT_MAC_SIGN_IDENTITY || '' }}
          SCOUT_MAC_NOTARY_PROFILE: ${{ github.event_name != 'pull_request' && vars.SCOUT_MAC_NOTARY_PROFILE || '' }}
        run: python scripts/build-installers.py --runtime-profile bootstrap --runtime-files dist/installers
      - name: Fetch explicitly pinned upgrade baseline
        if: vars.SCOUT_UPGRADE_BASELINE_VERSION != ''
        shell: bash
        env:
          TARGET: ${{ matrix.platform }}
          BASELINE_VERSION: ${{ vars.SCOUT_UPGRADE_BASELINE_VERSION }}
          LINUX_HASH: ${{ vars.SCOUT_UPGRADE_SHA256_LINUX_X86_64 }}
          WINDOWS_HASH: ${{ vars.SCOUT_UPGRADE_SHA256_WINDOWS_X86_64 }}
          MAC_ARM_HASH: ${{ vars.SCOUT_UPGRADE_SHA256_MACOS_ARM64 }}
          MAC_INTEL_HASH: ${{ vars.SCOUT_UPGRADE_SHA256_MACOS_X86_64 }}
        run: |
          case "$TARGET" in
            linux-x86_64) baseline_hash="$LINUX_HASH" ;;
            windows-x86_64) baseline_hash="$WINDOWS_HASH" ;;
            macos-arm64) baseline_hash="$MAC_ARM_HASH" ;;
            macos-x86_64) baseline_hash="$MAC_INTEL_HASH" ;;
          esac
          python scripts/prepare-upgrade.py --directory dist/installers --version "$BASELINE_VERSION" \
            --platform "$TARGET" --sha256 "$baseline_hash"
      - name: Create candidate manifest
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/release-candidate.py create --directory dist/installers \
            --platform "$CANDIDATE_PLATFORM" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Save disk image diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dmg-build-${{ matrix.platform }}
          overwrite: true
          path: build/installer/dmg-logs/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          overwrite: true
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  install-test:
    name: Install and smoke test ${{ matrix.platform }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-22.04}
          - {platform: windows-x86_64, os: windows-2022}
          - {platform: macos-arm64, os: macos-15}
          - {platform: macos-x86_64, os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Deliberately no checkout or Python/application dependency installation.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: downloaded
      - name: Install Linux desktop runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libasound2 libpulse0
      - name: Verify downloaded candidate before installing
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: |
          python downloaded/release-candidate.py verify --directory downloaded \
            --platform "$CANDIDATE_PLATFORM" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Install, exercise and uninstall (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python downloaded/test-installer.py downloaded --runtime-files downloaded
      - name: Install, exercise and uninstall (Windows/macOS)
        if: runner.os != 'Linux'
        run: python downloaded/test-installer.py downloaded --runtime-files downloaded
      - name: Record successful installed-candidate checks
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: |
          python downloaded/release-candidate.py record-test --directory downloaded \
            --platform "$CANDIDATE_PLATFORM" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: tested-installer-${{ matrix.platform }}
          overwrite: true
          path: downloaded/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Save install smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-${{ matrix.platform }}
          overwrite: true
          path: |
            downloaded/smoke-report.json
            downloaded/previous-smoke-report.json
            downloaded/upgrade-report.json
            downloaded/*.log
          if-no-files-found: ignore
