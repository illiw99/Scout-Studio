name: Standalone installers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-22.04}
          - {platform: windows-x86_64, os: windows-2022}
          - {platform: macos-arm64, os: macos-15}
          - {platform: macos-x86_64, os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/build-requirements.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel -r packaging/build-requirements.txt
      - name: Install CPU PyTorch (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install CUDA-capable PyTorch (Windows, also supports CPU fallback)
        if: runner.os == 'Windows'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
      - name: Install last Intel macOS PyTorch with compatible NumPy
        if: matrix.platform == 'macos-x86_64'
        run: python -m pip install torch==2.2.2 torchvision==0.17.2 "numpy<2"
      - name: Install application and desktop dependencies (Intel macOS)
        if: matrix.platform == 'macos-x86_64'
        run: python -m pip install ".[desktop]" "numpy<2" "torch==2.2.2" "torchvision==0.17.2"
      - name: Install application and desktop dependencies
        if: matrix.platform != 'macos-x86_64'
        run: python -m pip install ".[desktop]"
      - name: Use compatible headless OpenCV (Intel macOS)
        if: matrix.platform == 'macos-x86_64'
        run: |
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --no-deps "opencv-python-headless<4.12"
      - name: Use headless OpenCV to avoid a second Qt distribution
        if: matrix.platform != 'macos-x86_64'
        run: |
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --no-deps opencv-python-headless
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libpulse0 libasound2
      - name: Verify Windows bundle dependencies retain CUDA support
        if: runner.os == 'Windows'
        # Hosted runners have no GPU: verify build support, not device availability.
        run: python -c "import torch; assert torch.version.cuda is not None, 'Windows installer requires CUDA-capable PyTorch'; print('Bundling CUDA', torch.version.cuda)"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Check release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(python scripts/build-installers.py --version-only)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Run source regression tests
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Check Windows background helpers keep logs without console windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'test_processes.py' -v
      - name: Check macOS disk image creation and retry handling
        if: runner.os == 'macOS'
        run: python -m unittest discover -s tests -p 'test_installer_build.py' -v
      - name: Build native installer
        run: python scripts/build-installers.py
      - name: Save disk image diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dmg-build-${{ matrix.platform }}
          path: build/installer/dmg-logs/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  install-test:
    name: Install and smoke test ${{ matrix.platform }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-22.04}
          - {platform: windows-x86_64, os: windows-2022}
          - {platform: macos-arm64, os: macos-15}
          - {platform: macos-x86_64, os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Deliberately no checkout or Python/application dependency installation.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: downloaded
      - name: Install Linux desktop runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libasound2 libpulse0
      - name: Install, exercise and uninstall (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python downloaded/test-installer.py downloaded
      - name: Install, exercise and uninstall (Windows/macOS)
        if: runner.os != 'Linux'
        run: python downloaded/test-installer.py downloaded

      - name: Save install smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-${{ matrix.platform }}
          path: |
            downloaded/smoke-report.json
            downloaded/*.log
          if-no-files-found: ignore

  release:
    name: Publish tested installers
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, install-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: downloaded
      - name: Assemble release files and checksums
        shell: bash
        run: |
          mkdir release
          find downloaded -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' \) -exec cp {} release/ \;
          test "$(find release -type f | wc -l)" -eq 4
          cd release
          sha256sum *.exe *.deb *.dmg > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "Scout Studio ${GITHUB_REF_NAME#v}" \
            --notes 'Standalone native installers. Windows and macOS builds are unsigned; see the installation guide for platform security prompts. SHA256SUMS.txt verifies download integrity.'
